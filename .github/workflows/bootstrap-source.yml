name: Import Railway source

on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify Railway source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.part* | base64 --decode > /tmp/mantra-assistant-source.tar.gz
          echo "de8126aae8e0054de5b306e34a50729e4ea73633edee95d4a4492a1824f7f4c6  /tmp/mantra-assistant-source.tar.gz" | sha256sum --check
          tar -xzf /tmp/mantra-assistant-source.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import voz-clara source from Railway snapshot"
          git push origin HEAD:main
